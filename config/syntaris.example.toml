[app]
name = "syntaris"
environment = "development"

[llm]
# Paths are intentionally external to this repository.
# Windows example (either escaped backslashes or forward slashes):
# server_bin_path = "C:/Users/you/AppData/Local/Programs/llama-server.exe"
# model_path = "D:/models/your-model.gguf"
server_bin_path = "/absolute/path/to/llama-server"
model_path = "/absolute/path/to/model.gguf"
host = "127.0.0.1"
port = 8080

[paths]
data_dir = "./.syntaris"
db_path = "./.syntaris/runtime.db"

[conversation]
default_thread_key = "default"
default_mode = "chat"
context_turn_window = 5
snapshot_turn_window = 8
snapshot_include_recap_turns = false
snapshot_include_pending_turns = false
recall_line_limit = 3
recall_prefer_snapshot = true
response_followup_enabled = true
focus_turn_window = 8
focus_line_limit = 4
followup_resolution_enabled = true
max_comparison_candidates = 6
clarification_prefer_when_close = true
uncertainty_labeling_enabled = true
max_reasoning_units = 4
max_evidence_items_per_unit = 3
support_labeling_enabled = true
synthesis_include_next_step = true

[reply]
# deterministic | llama-http
backend = "deterministic"
live_url = "http://127.0.0.1:8080"
live_model = ""
timeout_seconds = 10.0

[trace]
enabled = true
level = "info"

# Text hygiene: runtime stores canonical text for orchestration/display while preserving raw turn text for audit in DB raw columns.

# Legacy derived artifacts (snapshot/focus) are runtime-refreshed and persisted cleanly when dirty text is detected.

# Runtime enforces derived artifact freshness (stale `last_turn_id`/`turn_count` triggers rebuild+writeback).

# Snapshot hygiene is line-level: any degraded line triggers deterministic rebuild/writeback from canonical turn text.

# Snapshot recall quality includes anti-recursion flattening for recap-like assistant lines.


[time]
timezone = "Europe/Budapest"
