[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntaris"
version = "0.1.0"
description = "Syntaris greenfield phase-0 foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
syntaris = "syntaris.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
